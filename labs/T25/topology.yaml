lab:
  title: T25-ci-twin
  description: CML twin of the NSO test devices ios0 and xr0, used as a CI test stage
  notes: ''
  version: 0.2.2
nodes:
  - id: n0
    label: ios0
    node_definition: iosv
    x: 0
    y: 0
    configuration: |-
      hostname ios0
      interface GigabitEthernet0/0
       ip address 10.0.0.1 255.255.255.252
       no shutdown
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: GigabitEthernet0/0
        slot: 0
        type: physical
  - id: n1
    label: xr0
    node_definition: iosxrv9000
    x: 240
    y: 0
    configuration: |-
      hostname xr0
      interface GigabitEthernet0/0/0/0
       ipv4 address 10.0.0.2 255.255.255.252
       no shutdown
    interfaces:
      - id: i0
        label: Loopback0
        type: loopback
      - id: i1
        label: MgmtEth0/RP0/CPU0/0
        slot: 0
        type: physical
      - id: i2
        label: GigabitEthernet0/0/0/0
        slot: 1
        type: physical
links:
  - id: l0
    n1: n0
    i1: i1
    n2: n1
    i2: i2
    label: ios0-Gi0/0<->xr0-Gi0/0/0/0
