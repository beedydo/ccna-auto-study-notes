    show ipv6 route: ''
    show vrf detail: ''
    config term:
      new_state: csr1_config
csr1_config:
  prompt: '%N(config)#'
  commands:
    no logging console: ''
    line console 0: ''
    exec-timeout 0: ''
    line vty 0 4: ''
    interface GigabitEthernet3:
      new_state: csr1_config_if
    end:
      new_state: csr1_exec
csr1_config_if:
  prompt: '%N(config-if)#'
  commands:
    ip address 10.30.0.1 255.255.255.252: ''
    no shutdown: ''
    exit:
      new_state: csr1_config_change
csr1_config_change:
  prompt: '%N(config)#'
  commands:
    ip route 198.51.100.0 255.255.255.0 10.30.0.2: ''
    end:
      new_state: csr1_exec_after
