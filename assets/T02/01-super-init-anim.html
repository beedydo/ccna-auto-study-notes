<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>T02 super().__init__ chain animation</title>
<style>
  :root { --ink:#1d1d1f; --muted:#666; --line:#2b2b2b; --code:#ececec;
          --wd:#fff3cd; --wd-b:#e0a800; --st:#d4edda; --st-b:#28a745;
          --lr:#d1ecf1; --lr-b:#17a2b8; --rr:#e8dcf7; --rr-b:#7b4bc4; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f7f7f5; font-family:-apple-system,"Helvetica Neue",Arial,sans-serif; color:var(--ink); }
  .sheet { width:1100px; height:560px; padding:22px 28px; position:relative; }
  h1 { margin:0 0 4px; font-size:26px; font-weight:800; }
  h1 .pill { background:#2fb380; color:#fff; padding:2px 14px; border-radius:20px; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:18px; }
  .lanes { display:grid; grid-template-columns:repeat(4, 1fr); gap:18px; }
  .lane { border:2.5px solid var(--line); border-radius:12px; height:250px; padding:10px; background:#fff; position:relative; }
  .lane h3 { margin:0 0 2px; font-size:16px; } .lane .where { font-size:12px; color:var(--muted); margin-bottom:10px; }
  .lane.wd { border-color:var(--wd-b); } .lane.st { border-color:var(--st-b); }
  .lane.lr { border-color:var(--lr-b); } .lane.rr { border-color:var(--rr-b); }
  .lane.active { box-shadow:0 0 0 5px rgba(47,179,128,.35); }
  .file { font-family:Menlo,monospace; font-size:13px; border:2px solid; border-radius:7px; padding:6px 8px; margin-bottom:8px; }
  .wd .file { background:var(--wd); border-color:var(--wd-b); } .st .file { background:var(--st); border-color:var(--st-b); }
  .lr .file { background:var(--lr); border-color:var(--lr-b); } .rr .file { background:var(--rr); border-color:var(--rr-b); }
  .file small { display:block; font-family:-apple-system,Arial,sans-serif; color:var(--muted); font-size:11px; }
  .ghost { opacity:.25; border-style:dashed; }
  .arrowrow { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; height:64px; position:relative; margin-top:10px; }
  .cmd { position:absolute; top:6px; font-family:Menlo,monospace; font-size:14px; font-weight:700;
         background:var(--ink); color:#fff; padding:6px 12px; border-radius:8px; white-space:nowrap; }
  .cmd::after { content:"➜"; margin-left:8px; color:#7ee2b8; }
  .cmd.back::after { content:""; } .cmd.back::before { content:"⬅ "; color:#ffd36b; }
  .step { position:absolute; left:28px; bottom:22px; right:28px; display:flex; align-items:center; gap:12px;
          background:#fff; border:2px solid var(--line); border-radius:10px; padding:10px 14px; font-size:15px; }
  .step .n { flex:none; width:30px; height:30px; border-radius:50%; background:var(--ink); color:#fff; font-weight:800;
             display:flex; align-items:center; justify-content:center; }
  .step code { font-family:Menlo,monospace; background:var(--code); padding:1px 6px; border-radius:4px; font-size:13.5px; }
  .dots { margin-left:auto; display:flex; gap:5px; } .dots i { width:9px; height:9px; border-radius:50%; background:#ccc; }
  .dots i.on { background:#2fb380; }

  .lanes { grid-template-columns: 1.55fr 1fr; }
  .lane { height: 300px; }
  .stack { display:flex; flex-direction:column-reverse; gap:6px; }
  .fr { font-family:Menlo,monospace; font-size:12.5px; border:2px solid #17a2b8; background:#d1ecf1; border-radius:7px; padding:6px 9px; }
  .fr.top { border-color:#e0a800; background:#fff3cd; box-shadow:0 0 0 4px rgba(224,168,0,.30); }
  .fr.done { opacity:.3; border-style:dashed; }
  .fr .ln { display:block; font-size:12px; color:#333; margin-top:3px; }
  .fr .ln b { background:#1d1d1f; color:#fff; padding:0 5px; border-radius:3px; font-weight:700; }
  .fr small { color:#666; font-family:-apple-system,Arial,sans-serif; font-size:11px; }
  .obj { font-family:Menlo,monospace; font-size:13px; }
  .obj .hd { font-weight:800; margin-bottom:8px; }
  .attr { border:2px solid #28a745; background:#d4edda; border-radius:6px; padding:4px 8px; margin-bottom:6px; }
  .attr.new { box-shadow:0 0 0 4px rgba(47,179,128,.45); }
  .attr.empty { border:2px dashed #bbb; background:#f4f4f4; color:#aaa; }
  .attr.err { border-color:#dc3545; background:#fde8e8; color:#b42318; font-weight:700; }
  .lane.bad { border-color:#dc3545; }
</style>
</head>
<body>
<div class="sheet">
  <h1>T02 · <span class="pill">super().__init__()</span> who sets the attributes?</h1>
  <div class="sub"><code>make_device({"hostname": "csr1", ..., "os": "iosxe"})</code> from <code>labs/T02/</code>. Left: what's running now. Right: the new object.</div>
  <div class="lanes">
    <div class="lane wd" id="wd"><h3>🧵 Call stack (top = running now)</h3><div class="where">netlib/devices.py · build_inventory.py</div><div class="stack" id="wd-f"></div></div>
    <div class="lane st" id="st"><h3>🧱 The new object</h3><div class="where">vars(obj)</div><div id="st-f"></div></div>
  </div>
  <div class="arrowrow" id="arrows"></div>
  <div class="step"><div class="n" id="n">1</div><div id="txt"></div><div class="dots" id="dots"></div></div>
</div>
<script>
const fr = (name, line, where, cls="") => `<div class="fr ${cls}">${name} <small>${where}</small><span class="ln">${line}</span></div>`;
const A = (k, v, cls="") => `<div class="attr ${cls}">${k} = ${v}</div>`;
const E = (t) => `<div class="attr empty">${t}</div>`;
const md  = (c="") => fr("make_device(row)", "<b>L26</b> return cls.from_dict(row)", "cls = IOSXE", c);
const fd  = (c="") => fr("Device.from_dict(cls, data)", "<b>L31</b> return cls(data[\"hostname\"], data[\"mgmt_ip\"])", "@classmethod · cls = IOSXE", c);
const ix  = (l, c="") => fr("IOSXE.__init__(self, ...)", l, "child · port=443", c);
const dv  = (l, c="") => fr("Device.__init__(self, ...)", l, "parent · reached via super()", c);
const obj = (type, rows) => `<div class="obj"><div class="hd">${type}</div>${rows}</div>`;
const frames = [
  { active:"wd", wd: md("top"),
    st: obj("(not created yet)", E("—")),
    cmd:{at:0, t:"cls = PLATFORMS[\"iosxe\"]"},
    txt:"<code>make_device()</code> looks up the class: <code>\"iosxe\"</code> → <code>IOSXE</code>. It calls <code>cls.from_dict(row)</code>." },
  { active:"wd", wd: md() + fd("top"),
    st: obj("(not created yet)", E("—")),
    cmd:{at:0, t:"@classmethod gets cls"},
    txt:"<code>from_dict</code> is a <b>classmethod</b>, so <code>cls</code> is <b>IOSXE</b>, not Device. <code>cls(...)</code> will build an IOSXE." },
  { active:"st", wd: md() + fd() + ix("<b>L41</b> super().__init__(hostname, mgmt_ip, port)", "top"),
    st: obj("IOSXE object", E("{}  ← empty: nothing set yet")),
    cmd:{at:1, t:"IOSXE.__init__ runs FIRST"},
    txt:"Python runs the <b>child's</b> <code>__init__</code> (IOSXE defines its own). The object exists but is <b>empty</b>." },
  { active:"st", wd: md() + fd() + ix("<b>L41</b> super().__init__(...)  ⏸ waiting") + dv("<b>L13–16</b> self.hostname = hostname …", "top"),
    st: obj("IOSXE object", A("hostname", "'csr1'", "new") + A("mgmt_ip", "'10.10.20.48'", "new") + A("port", "443", "new") + A("_token", "None", "new")),
    cmd:{at:1, t:"super() → Device.__init__"},
    txt:"<code>super().__init__()</code> jumps to the <b>parent</b>, which sets the shared attributes. <code>port</code> is <b>443</b>: IOSXE passed its own default." },
  { active:"st", wd: md() + fd() + ix("<b>L42</b> self.api = \"RESTCONF\"", "top") + dv("returned", "done"),
    st: obj("IOSXE object", A("hostname", "'csr1'") + A("mgmt_ip", "'10.10.20.48'") + A("port", "443") + A("_token", "None") + A("api", "'RESTCONF'", "new")),
    cmd:{at:1, t:"back in the child", back:true},
    txt:"Control <b>returns</b> to IOSXE, which adds what's specific to it: <code>api</code>. Five attributes in total." },
  { active:"st", wd: fr("make_device(row)", "returned IOSXE object", "", "done"),
    st: obj("IOSXE object ✅", A("hostname", "'csr1'") + A("mgmt_ip", "'10.10.20.48'") + A("port", "443") + A("_token", "None") + A("api", "'RESTCONF'")),
    cmd:null,
    txt:"Done. Real output: <code>{'hostname': 'csr1', 'mgmt_ip': '10.10.20.48', 'port': 443, '_token': None, 'api': 'RESTCONF'}</code>" },
  { active:"st", bad:true, wd: md() + fd() + ix("<s>super().__init__(...)</s>  ← line deleted", "top"),
    st: obj("IOSXE object ❌", A("api", "'RESTCONF'") + E("hostname: never set") + E("mgmt_ip: never set") + `<div class="attr err">d.connect() → AttributeError: 'IOSXE' object has no attribute 'hostname'</div>`),
    cmd:{at:1, t:"without super()"},
    txt:"<b>Trap:</b> delete the <code>super()</code> line and the parent's <code>__init__</code> <b>never runs</b>. Only <code>api</code> is set. It fails later, in <code>connect()</code>." },
];
const pos = [180, 690];
function show(i) {
  const f = frames[i];
  for (const k of ["wd","st"]) {
    document.getElementById(k+"-f").innerHTML = f[k];
    document.getElementById(k).classList.toggle("active", f.active === k);
  }
  document.getElementById("st").classList.toggle("bad", !!f.bad);
  const a = document.getElementById("arrows"); a.innerHTML = "";
  if (f.cmd) {
    const d = document.createElement("div"); d.className = "cmd" + (f.cmd.back ? " back" : "");
    d.textContent = f.cmd.t; d.style.left = pos[f.cmd.at] + "px"; a.appendChild(d);
  }
  document.getElementById("n").textContent = i + 1;
  document.getElementById("txt").innerHTML = f.txt;
  document.getElementById("dots").innerHTML = frames.map((_, j) => `<i class="${j <= i ? "on" : ""}"></i>`).join("");
}
window.FRAME_COUNT = frames.length; window.show = show;
show(Number(new URLSearchParams(location.search).get("f") || 0));
</script>
</body>
</html>
